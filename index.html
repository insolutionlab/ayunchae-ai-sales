<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#001F7A">
<title>생성형 AI를 활용한 영업 역량 강화 과정 · 아윤채 웹교재</title>
<style>
:root{
  --cobalt:#001F7A; --cobalt2:#0A2472; --green:#00704A; --ink:#14171D; --paper:#FCFDFE;
  --body:#3C4149; --sub:#6B7280; --hair:#DDE1E8; --tint:#EDF1F6; --ghost:#B9C2D0; --white:#FFFFFF;
  --pbg:#F4F6FA; --pline:#E6EAF1; --slot:#FFF0B3; --slottx:#6B3F00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere;
}
.wrap{max-width:840px;margin:0 auto;padding:0 18px}

/* 머리 */
.top{background:var(--paper);padding:22px 0 18px}
.cover{position:relative;overflow:hidden;border-radius:22px;padding:34px 30px 32px;color:var(--white);
  background:radial-gradient(120% 140% at 100% 0%,#1C6E9A 0%,rgba(28,110,154,0) 55%),linear-gradient(120deg,#0A1F6B 0%,#001A7A 55%,#2B4C8C 100%);
  box-shadow:0 10px 28px rgba(0,31,122,.18)}
.cover .eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;color:#3FE0C5}
.cover h1{margin-top:10px;font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.25;color:var(--white)}
.cover .sub{margin-top:12px;font-size:16px;color:rgba(255,255,255,.78)}
.cover .deco{position:absolute;right:-6px;bottom:-4px;width:230px;height:auto;opacity:.95}

/* 상단 고정 칩 목차 */
.nav{position:sticky;top:0;z-index:50;background:rgba(252,253,254,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 15px;border-radius:999px;border:1px solid var(--hair);background:var(--white);color:var(--body);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip i{font-style:normal;font-size:11.5px;font-weight:800;color:var(--cobalt);letter-spacing:.04em}
.chip:hover{border-color:var(--cobalt);color:var(--cobalt)}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:var(--white)}
.chip.on i{color:#C7CFE6}
.chip:focus-visible{outline:3px solid #7FA6DF;outline-offset:2px}

/* 구간 */
main{padding:6px 0 30px}
.sec{padding:34px 0 14px}
.sec+.sec{border-top:1px solid var(--hair)}
.shead{display:flex;align-items:center;gap:12px}
.smark{flex:0 0 auto;width:6px;height:26px;border-radius:3px;background:linear-gradient(180deg,var(--cobalt),#2FD1B5)}
.sec h2{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.35}
.intro{margin-top:12px;color:var(--body)}
.points{list-style:none;margin:12px 0 0;display:grid;gap:7px}
.points li{position:relative;padding-left:18px;color:var(--body);font-size:15.5px}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--green)}

/* 카드 */
.cards{display:grid;gap:14px;margin-top:22px}
.card{background:var(--white);border:1px solid var(--hair);border-radius:16px;padding:18px 18px 16px;box-shadow:0 1px 2px rgba(0,31,122,.04)}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:8px}
.kind{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--cobalt);background:var(--tint);padding:4px 10px;border-radius:999px;white-space:nowrap}
.kind.prompt{background:var(--cobalt);color:var(--white)}
.kind.md{background:var(--green);color:var(--white)}
.tool{font-size:13.5px;color:var(--sub)}
.tool b{color:var(--ink);font-weight:700}
.card h3{font-size:17px;font-weight:700;line-height:1.4;letter-spacing:-.01em;margin-bottom:10px}
pre.pbox{font-family:inherit;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;background:var(--pbg);border:1px solid var(--pline);border-radius:12px;padding:15px 16px;font-size:16px;line-height:1.7;color:var(--ink);font-feature-settings:"tnum";margin:0}
mark.slot{background:var(--slot);color:var(--slottx);border-radius:4px;padding:0 3px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font-family:inherit;cursor:pointer;border:none;min-height:44px;padding:9px 18px;border-radius:999px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.btn.copy{background:var(--cobalt);color:var(--white)}
.btn.copy:hover{background:var(--cobalt2)}
.btn.copy.done{background:var(--green)}
.btn.dl{background:var(--white);color:var(--cobalt);border:1px solid var(--ghost)}
.btn.dl:hover{background:var(--tint)}
.btn.all{background:var(--ink);color:var(--white);padding:12px 26px;font-size:15px;min-height:52px}
.btn.all:hover{background:#2A2F38}
.btn:focus-visible{outline:3px solid #7FA6DF;outline-offset:2px}

/* 단계 · 항목 · 표 · 안내 */
ol.steps{list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
ol.steps li{background:var(--tint);border-radius:12px;border-top:4px solid var(--cobalt);padding:13px 14px 14px;font-size:15px;color:var(--body);line-height:1.6}
ol.steps b{display:block;color:var(--ink);font-weight:700;margin-bottom:6px}
ol.steps .d{display:block}
ul.check{list-style:none;display:grid;gap:14px}
ul.check li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;color:var(--body);line-height:1.6}
ul.check .d{display:block;margin-top:2px;color:var(--body)}
ul.check .ico{flex:0 0 auto;width:20px;height:20px;margin-top:3px;color:var(--green)}
ul.check .ico svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
ul.check b{display:block;color:var(--ink);font-weight:700}
.tblwrap{width:100%}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;background:var(--tint);color:var(--cobalt);font-weight:700;padding:9px 10px;border-bottom:2px solid #C9D2E3;vertical-align:top}
td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--body)}
.tnote,.tip p{font-size:15.5px;color:var(--body)}
.tnote{margin-top:10px}
.tip p+p{margin-top:8px}
.cnote{margin-top:12px;padding:10px 14px;border-left:3px solid var(--sub);background:rgba(0,0,0,.025);border-radius:6px}
.cnote b{display:block;font-size:13.5px;color:var(--sub);margin-bottom:2px}
.cnote p{font-size:14.5px;color:var(--body);line-height:1.6;margin:0}
details.note.fold{margin-top:0;border-top:0;padding-top:0}
details.note.fold summary{font-size:16px;color:var(--ink)}
details.note{margin-top:12px;border-top:1px dashed var(--hair);padding-top:6px}
details.note summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--sub);list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:36px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(-45deg);transition:transform .15s}
details.note[open] summary::before{transform:rotate(45deg)}
details.note p{margin-top:4px;font-size:14.5px;color:var(--body);line-height:1.6}

/* 바닥 */
.foot{padding:30px 0 60px;border-top:1px solid var(--hair);text-align:center}
.foot p{margin-top:12px;font-size:13.5px;color:var(--sub)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--white);font-size:14px;font-weight:600;padding:13px 24px;border-radius:999px;opacity:0;transition:opacity .28s,transform .28s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:600px){
  table,table thead,table tbody,table tr,table th,table td{display:block;width:100%}
  table thead{display:none}
  table tr{border:1px solid var(--hair);border-radius:10px;padding:4px 0;margin-bottom:8px;background:var(--white)}
  table td{border-bottom:0;padding:7px 12px}
  table td+td{border-top:1px dashed var(--hair)}
  table td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;color:var(--cobalt);margin-bottom:2px;letter-spacing:.01em}
}
@media (max-width:520px){
  .top{padding:14px 0 14px}
  .cover{padding:26px 20px 70px;border-radius:18px}
  .cover h1{font-size:25px}
  .cover .deco{width:170px}
  .sec h2{font-size:19px}
  .card{padding:16px 14px 14px;border-radius:14px}
  pre.pbox{padding:13px 13px;font-size:15.5px}
  .btn.copy,.btn.dl{width:100%}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .chip,.btn,.toast,details.note summary::before{transition:none}
}
@media print{
  .nav,.btns,.foot,.toast{display:none !important}
  body{background:#fff}
  .top{border-bottom:1px solid #999}
  .card,ol.steps li,table tr{break-inside:avoid;page-break-inside:avoid}
  .card{box-shadow:none;border-color:#bbb}
  pre.pbox{border-color:#bbb;background:#fff}
  details.note{border-top-color:#bbb}
  .wrap{max-width:100%}
  a[href]::after{content:""}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="cover">
      <p class="eyebrow">GENERATIVE AI · WORKBOOK</p>
      <h1 id="title">생성형 AI를 활용한<br>영업 역량 강화 과정</h1>

      <svg class="deco" viewBox="0 0 260 130" aria-hidden="true"><path d="M8 122 C 70 104, 120 92, 160 66 S 230 26, 258 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="4 7"/><circle cx="18" cy="118" r="8" fill="#7C9CFF"/><circle cx="70" cy="101" r="8" fill="#9DB3D9"/><circle cx="124" cy="84" r="8" fill="#F4A989"/><circle cx="178" cy="55" r="8" fill="#2FD1B5"/><circle cx="232" cy="27" r="9" fill="#B9A6F2"/></svg>
    </div>
  </div>
</header>

<nav class="nav" aria-label="구간 목차">
  <div class="wrap chips" id="nav"></div>
</nav>

<main id="main" class="wrap"></main>

<footer class="foot">

  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

  /* 항목 앞 아이콘 · 뜻을 닮은 꼴(깃발 · 방패 · 말풍선 · 돋보기 · 문서) */
  var ICONS = {
    flag: "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 21V4\"/><path d=\"M5 4h12l-2 4 2 4H5\"/></svg>",
    shield: "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z\"/></svg>",

    doc: "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"/><path d=\"M14 3v4h4\"/><path d=\"M10 12h6M10 16h6\"/></svg>"
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c];
    });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function slot(h) {
    return h.replace(/\[[^\[\]\n]{1,80}\]/g, function (m) { return "<mark class=\"slot\">" + m + "</mark>"; });
  }
  function splitLabel(t) {
    var i = t.indexOf(" · ");
    if (i < 0) return "<b>" + esc(t) + "</b>";
    return "<b>" + esc(t.slice(0, i)) + "</b><span class=\"d\">" + esc(t.slice(i + 3)) + "</span>";
  }
  function nonEmpty(arr) { return arr.filter(function (l) { return l.trim() !== ""; }); }

  function renderSteps(body) {
    var items = [], rest = [];
    body.split("\n").forEach(function (l) {
      var m = l.match(/^\s*(\d+)\.\s*(.*)$/);
      if (m) items.push(m[2]); else if (l.trim()) rest.push(l);
    });
    var h = "<ol class=\"steps\">";
    items.forEach(function (t, i) {
      var j = t.indexOf(" · ");
      var label = j < 0 ? t : t.slice(0, j), desc = j < 0 ? "" : t.slice(j + 3);
      h += "<li><b>" + esc(label) + "</b>" + (desc ? "<span class=\"d\">" + esc(desc) + "</span>" : "") + "</li>";
    });
    h += "</ol>";
    rest.forEach(function (l) { h += "<p class=\"tnote\">" + esc(l) + "</p>"; });
    return h;
  }

  function renderChecklist(body, icon) {
    var items = [], rest = [];
    body.split("\n").forEach(function (l) {
      var m = l.match(/^\s*-\s+(.*)$/);
      if (m) items.push(m[1]); else if (l.trim()) rest.push(l);
    });
    var ico = ICONS[icon] || ICONS.doc;
    var h = "<ul class=\"check\">";
    items.forEach(function (t) {
      h += "<li><span class=\"ico\">" + ico + "</span><span>" + splitLabel(t) + "</span></li>";
    });
    h += "</ul>";
    rest.forEach(function (l) { h += "<p class=\"tnote\">" + esc(l) + "</p>"; });
    return h;
  }

  function renderTable(body) {
    var rows = [], rest = [];
    body.split("\n").forEach(function (l) {
      var t = l.trim();
      if (!t) return;
      if (t.charAt(0) === "|") {
        if (/^\|\s*:?-+/.test(t)) return;
        var cells = t.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
        rows.push(cells);
      } else rest.push(t);
    });
    if (!rows.length) return "";
    var head = rows[0];
    var h = "<div class=\"tblwrap\"><table><thead><tr>";
    head.forEach(function (c) { h += "<th>" + esc(c) + "</th>"; });
    h += "</tr></thead><tbody>";
    rows.slice(1).forEach(function (r) {
      h += "<tr>";
      r.forEach(function (c, i) { h += "<td data-label=\"" + esc(head[i] || "") + "\">" + esc(c) + "</td>"; });
      h += "</tr>";
    });
    h += "</tbody></table></div>";
    rest.forEach(function (l) { h += "<p class=\"tnote\">" + esc(l) + "</p>"; });
    return h;
  }

  function renderTip(body) {
    var h = "<div class=\"tip\">";
    nonEmpty(body.split("\n")).forEach(function (l) { h += "<p>" + esc(l) + "</p>"; });
    return h + "</div>";
  }

  function renderPre(body) {
    return "<pre class=\"pbox\">" + slot(esc(body.trim())) + "</pre>";
  }

  function renderBlock(b, si, bi) {
    var h = "<article class=\"card\" data-s=\"" + si + "\" data-b=\"" + bi + "\">";
    h += "<div class=\"chead\"><span class=\"kind " + b.kind + "\">" + KIND_LABEL[b.kind] + "</span>";
    if (b.tool) h += "<span class=\"tool\">도구 · <b>" + esc(b.tool) + "</b></span>";
    h += "</div>";
    if (b.fold) {
      var fb = b.kind === "table" ? renderTable(b.body) : b.kind === "checklist" ? renderChecklist(b.body, b.icon) : b.kind === "steps" ? renderSteps(b.body) : renderTip(b.body);
      return h + "<details class=\"note fold\"><summary>" + esc(b.title) + "</summary>" + fb + "</details></article>";
    }
    h += "<h3>" + esc(b.title) + "</h3>";
    if (b.kind === "prompt") {
      h += renderPre(b.body);
      h += "<div class=\"btns\"><button type=\"button\" class=\"btn copy\" data-act=\"copy\">요청문 복사</button>" +
           "<button type=\"button\" class=\"btn dl\" data-act=\"mdcopy\">메모용 글로 복사</button></div>";
    } else if (b.kind === "md") {
      h += renderPre(b.body);
      h += "<div class=\"btns\"><button type=\"button\" class=\"btn copy\" data-act=\"copy\">복사</button>" +
           "<button type=\"button\" class=\"btn dl\" data-act=\"md\">.md 내려받기</button></div>";
    } else if (b.kind === "steps") {
      h += renderSteps(b.body);
    } else if (b.kind === "checklist") {
      h += renderChecklist(b.body, b.icon);
    } else if (b.kind === "table") {
      h += renderTable(b.body);
    } else {
      h += renderTip(b.body);
    }
    if (b.note) {
      h += "<div class=\"cnote\"><b>결과에서 볼 것</b><p>" + esc(b.note) + "</p></div>";
    }
    return h + "</article>";
  }

  function render() {
    var nav = document.getElementById("nav");
    var main = document.getElementById("main");
    var nh = "", mh = "";
    SECTIONS.forEach(function (s, i) {
      nh += "<a class=\"chip\" href=\"#" + s.id + "\" data-id=\"" + s.id + "\">" + esc(s.nav_label) + "</a>";
      mh += "<section class=\"sec\" id=\"" + s.id + "\">";
      mh += "<div class=\"shead\"><span class=\"smark\" aria-hidden=\"true\"></span><h2>" + esc(s.heading) + "</h2></div>";
      if (s.intro) mh += "<p class=\"intro\">" + esc(s.intro) + "</p>";
      if (s.points && s.points.length) {
        mh += "<ul class=\"points\">";
        s.points.forEach(function (p) { mh += "<li>" + esc(p) + "</li>"; });
        mh += "</ul>";
      }
      mh += "<div class=\"cards\">";
      s.blocks.forEach(function (b, j) { mh += renderBlock(b, i, j); });
      mh += "</div></section>";
    });
    nav.innerHTML = nh;
    main.innerHTML = mh;
  }

  /* 토스트 */
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1700);
  }

  /* 복사 */
  function fallbackCopy(text) {
    return new Promise(function (ok, no) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      ta.style.fontSize = "16px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) {}
      var r = false;
      try { r = document.execCommand("copy"); } catch (e) { r = false; }
      document.body.removeChild(ta);
      if (r) ok(); else no(new Error("copy failed"));
    });
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  function markDone(btn) {
    var o = btn.getAttribute("data-label");
    if (!o) { o = btn.textContent; btn.setAttribute("data-label", o); }
    clearTimeout(btn._t);
    btn.textContent = "복사됨";
    btn.classList.add("done");
    btn._t = setTimeout(function () { btn.textContent = o; btn.classList.remove("done"); }, 1800);
  }
  function selectPre(card) {
    try {
      var pre = card && card.querySelector("pre.pbox");
      if (!pre) return;
      var r = document.createRange(); r.selectNodeContents(pre);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
  }

  /* 내려받기 */
  function save(name, text, mime) {
    if (/KAKAOTALK/i.test(navigator.userAgent)) {
      copyText(text).then(function () {
        toast("카카오톡 안에서는 내려받기가 안 되어 내용을 복사했습니다. 오른쪽 위 메뉴에서 다른 브라우저로 열면 내려받을 수 있습니다");
      }, function () {
        toast("오른쪽 위 메뉴에서 다른 브라우저로 열어 내려받아 주십시오");
      });
      return;
    }
    try {
      var blob = new Blob([text], { type: (mime || "text/markdown") + ";charset=utf-8" });
      var u = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = u;
      a.download = name;
      a.setAttribute("download", name);
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(u); }, 1200);
      toast("내려받기를 시작했습니다");
    } catch (e) {
      toast("이 화면에서는 내려받기를 쓸 수 없습니다. 복사 단추로 옮겨 주십시오");
    }
  }
  function safeName(t) {
    return t.replace(/[^0-9A-Za-z가-힣]+/g, "_").replace(/^_+|_+$/g, "") || "양식";
  }
  function buildAll() {
    var d = new Date();
    var o = "# " + TITLE + "\n\n" + SUBTITLE + "\n\n작성일 " + d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일\n";
    SECTIONS.forEach(function (s, i) {
      var items = s.blocks.filter(function (b) { return b.kind === "prompt" || b.kind === "md"; });
      if (!items.length) return;
      o += "\n## " + s.heading + "\n";
      items.forEach(function (b) {
        o += "\n### " + b.title + "\n";
        if (b.tool) o += "\n도구: " + b.tool + "\n";
        o += "\n```\n" + b.body.trim() + "\n```\n";
        if (b.note) o += "\n결과에서 볼 것 · " + b.note + "\n";
      });
    });
    return o;
  }
  function getBlock(card) {
    var s = SECTIONS[parseInt(card.getAttribute("data-s"), 10)];
    return s ? s.blocks[parseInt(card.getAttribute("data-b"), 10)] : null;
  }

  /* 이벤트 위임 */
  function bindEvents() {
    document.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest("button[data-act]") : null;
      if (!btn) return;
      var act = btn.getAttribute("data-act");
      if (act === "all") { save("아윤채_영업AI_요청문_양식_전체.md", buildAll()); return; }
      var card = btn.closest(".card");
      if (!card) return;
      if (act === "copy") {
        var pre = card.querySelector("pre.pbox");
        if (!pre) return;
        var text = pre.textContent.trim();
        copyText(text).then(function () {
          markDone(btn);
          toast("복사되었습니다");
        }, function () {
          selectPre(card);
          toast("선택해 두었습니다. 길게 눌러 복사해 주십시오");
        });
      } else if (act === "mdcopy") {
        var pb = getBlock(card);
        if (!pb) return;
        var md = "### " + pb.title + "\n\n" + (pb.tool ? "도구: " + pb.tool + "\n\n" : "") + "```\n" + pb.body.trim() + "\n```\n" + (pb.note ? "\n결과에서 볼 것 · " + pb.note + "\n" : "");
        copyText(md).then(function () { markDone(btn); toast("메모용 글로 복사되었습니다"); }, function () { selectPre(card); toast("선택해 두었습니다. 길게 눌러 복사해 주십시오"); });
      } else if (act === "md") {
        var b = getBlock(card);
        if (!b) return;
        save(safeName(b.title) + ".md", b.body.trim() + "\n");
      }
    });
  }

  /* 현재 칩 칠하기 */
  function setupNavHighlight() {
    var chips = Array.prototype.slice.call(document.querySelectorAll("#nav .chip"));
    var secs = SECTIONS.map(function (s) { return document.getElementById(s.id); });
    var nav = document.getElementById("nav");
    var current = "";
    function setActive(id) {
      if (id === current) return;
      current = id;
      chips.forEach(function (c) {
        var on = c.getAttribute("data-id") === id;
        c.classList.toggle("on", on);
        if (on) {
          var left = c.offsetLeft - 12, right = c.offsetLeft + c.offsetWidth + 12;
          if (left < nav.scrollLeft) nav.scrollLeft = left;
          else if (right > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = right - nav.clientWidth;
        }
      });
    }
    function byScroll() {
      var y = window.scrollY + 110, id = SECTIONS[0].id;
      secs.forEach(function (s) { if (s && s.offsetTop <= y) id = s.id; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) id = SECTIONS[SECTIONS.length - 1].id;
      setActive(id);
    }
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) setActive(en.target.id); });
      }, { rootMargin: "-18% 0px -70% 0px", threshold: 0 });
      secs.forEach(function (s) { if (s) io.observe(s); });
      window.addEventListener("scroll", function () {
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) setActive(SECTIONS[SECTIONS.length - 1].id);
      }, { passive: true });
    } else {
      window.addEventListener("scroll", byScroll, { passive: true });
    }
    byScroll();
  }

  /* 인쇄 때 메모 펼치기 */
  function setupPrint() {
    var opened = [];
    window.addEventListener("beforeprint", function () {
      opened = [];
      document.querySelectorAll("details.note").forEach(function (d) {
        if (!d.open) { d.open = true; opened.push(d); }
      });
    });
    window.addEventListener("afterprint", function () {
      opened.forEach(function (d) { d.open = false; });
      opened = [];
    });
  }

  function init() {
    render();
    bindEvents();
    setupNavHighlight();
    setupPrint();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
